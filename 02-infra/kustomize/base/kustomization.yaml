apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-webinar

# The VirtualImage is shared by the whole project, see 01-image/packer.
resources:
- ./vm.yaml
- ./vd.yaml
- ./expose.yaml   # Service + Ingress + Certificate + NetworkPolicy

configurations:
- ./transformer.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: demo-kustomize
    files:
      - userdata=cfg/cloudinit.yaml
    type: provisioning.virtualization.deckhouse.io/cloud-init
