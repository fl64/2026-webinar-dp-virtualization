#cloud-config
users:
  - name: cloud
    passwd: $6$democlassic$cCgnx/0VM48BpLaMDyWq/Rktdd5PkM4weRgnH1nQ3yas6Ja2zlMgpQzmavAUiDTg5rPm49p0Wgpt9QxUFN87n. # cloud
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    chpasswd: { expire: False }
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFVsaFrxjnt0m2m9HAP7Z/jhvEg61K/rJj+TDV0eTHcx demo@webinar2026
package_update: true
packages:
  - openssh-server
  - qemu-guest-agent
  - nginx
# bootcmd, not write_files: write_files runs once per instance and would skip an existing VM.
# Unquoted heredoc: every overlay VM prints its own hostname, the page is not patched per overlay.
bootcmd:
  - mkdir -p /var/www/html
  - |
    cat > /var/www/html/index.html <<HTML
    <!doctype html>
    <html>
      <head>
        <meta charset="utf-8">
        <title>$(hostname)</title>
      </head>
      <body>
        <h1>$(hostname)</h1>
        <p>Hello, kustomize!</p>
      </body>
    </html>
    HTML
runcmd:
  - systemctl enable --now ssh
  - systemctl enable --now qemu-guest-agent
  - systemctl enable --now nginx
final_message: "🔥🔥🔥 The system is finally up, after $UPTIME seconds 🔥🔥🔥"
