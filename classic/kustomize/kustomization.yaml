apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-webinar

# The VirtualImage is shared by the whole project, see project/vi.yaml.
resources:
- ./vm.yaml
- ./vmd-root.yaml
- ./expose.yaml   # Service + Ingress + Certificate + NetworkPolicy

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: demo-kustomize
    files:
      - userdata=cfg/cloudinit.yaml
    type: provisioning.virtualization.deckhouse.io/cloud-init
