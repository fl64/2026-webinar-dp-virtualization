[defaults]
# Пути считаются от каталога этого файла: инвентарь из кластера и ключ демо.
inventory = inventory.sh
remote_user = cloud
private_key_file = ../../keys/demo_ed25519
# Реплики VirtualMachinePool эфемерные: имена и host-ключи меняются на каждый
# create/destroy. Без этого ssh спрашивает подтверждение ключа, в GUI-сессии
# подхватывает ssh-askpass и падает с "Host key verification failed".
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
# ControlMaster/ControlPersist — дефолт ansible, сохраняем; в /dev/null пишем,
# чтобы known_hosts не зарастал мёртвыми репликами. IdentitiesOnly: образ пускает
# не больше 4 попыток входа (MaxAuthTries), а ключи из ssh-агента идут раньше --private-key.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
pipelining = True

[privilege_escalation]
become = True
