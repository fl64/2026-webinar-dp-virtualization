---
# The webinar schedule: stamp.yml every minute, so the time in /etc/motd moves while the audience watches.
# Delete it after the show.
apiVersion: ansible.deckhouse.io/v1alpha1
kind: AnsibleRunSchedule
metadata:
  name: demo-stamp-every-minute
  namespace: demo-webinar
spec:
  schedule: "*/1 * * * *"
  timeZone: "Europe/Moscow"
  template:
    spec:
      playbook:
        type: Git
        git:
          url: https://github.com/fl64/2026-webinar-dp-virtualization.git
          revision: main
          path: 03-lifecycle/playbooks/stamp.yml
        vars:
          - name: updated_by
            value: AnsibleRunSchedule
      target:
        type: VirtualMachines
        virtualMachines:
          selector:
            matchLabels:
              role: demo
      connection:
        secretRef:
          name: demo-pool
