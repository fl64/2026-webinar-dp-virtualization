apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-webinar

resources:
  - clone.yaml

# Every key of a sysprep Secret becomes a file on the provisioning CD, so authorized_keys rides
# along as a plain file; it is not in git, step 5 of 01-image.md copies the demo key into cfg/.
secretGenerator:
  - name: demo-win
    type: provisioning.virtualization.deckhouse.io/sysprep
    files:
      - cfg/unattend.xml
      - cfg/authorized_keys

generatorOptions:
  disableNameSuffixHash: true
