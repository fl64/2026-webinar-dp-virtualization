---
apiVersion: virtualization.deckhouse.io/v1alpha2
kind: VirtualDisk
metadata:
  name: demo-win-root
spec:
  # No size: it comes from the image, and spelling out the same 12Gi fails, raw needs a few MiB more.
  dataSource:
    type: ObjectRef
    objectRef:
      kind: VirtualImage
      name: demo-windows-server-2022-sysprep
---
apiVersion: virtualization.deckhouse.io/v1alpha2
kind: VirtualMachine
metadata:
  name: demo-win
spec:
  virtualMachineClassName: generic
  runPolicy: AlwaysOnUnlessStoppedManually
  osType: Windows
  bootloader: EFI
  # The virtio drivers are already in the image.
  enableParavirtualization: true
  cpu:
    cores: 2
  memory:
    size: 4Gi
  provisioning:
    type: SysprepRef
    sysprepRef:
      kind: Secret
      # unattend.xml (specialize + oobeSystem) and authorized_keys, generated by kustomization.yaml
      name: demo-win
  blockDeviceRefs:
    - kind: VirtualDisk
      name: demo-win-root
