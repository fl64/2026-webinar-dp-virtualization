---
# Project images, applied apart from the kustomization: the build VM goes in only once both are Ready.
apiVersion: virtualization.deckhouse.io/v1alpha2
kind: VirtualImage
metadata:
  name: demo-win-iso
  namespace: demo-webinar
spec:
  storage: ContainerRegistry
  dataSource:
    type: HTTP
    http:
      url: https://go.microsoft.com/fwlink/p/?LinkID=2195280
---
apiVersion: virtualization.deckhouse.io/v1alpha2
kind: VirtualImage
metadata:
  name: demo-win-virtio
  namespace: demo-webinar
spec:
  storage: ContainerRegistry
  dataSource:
    type: HTTP
    http:
      url: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.302-1/virtio-win-0.1.302.iso
