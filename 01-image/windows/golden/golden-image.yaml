---
# A project image, taken off the disk restored from the snapshot in snapshot.yaml.
apiVersion: virtualization.deckhouse.io/v1alpha2
kind: VirtualImage
metadata:
  name: demo-windows-server-2022-golden
  namespace: demo-webinar
spec:
  storage: ContainerRegistry
  dataSource:
    type: ObjectRef
    objectRef:
      kind: VirtualDisk
      name: demo-win-golden
