apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-webinar

resources:
  - vm.yaml

secretGenerator:
  - name: demo-win-build
    type: provisioning.virtualization.deckhouse.io/sysprep
    files:
      - cfg/autounattend.xml

# vm.yaml references the Secret by name in sysprepRef, so no name suffix.
generatorOptions:
  disableNameSuffixHash: true
