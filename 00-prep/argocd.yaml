  # KubeVirt and CDI objects are created by the DVP controllers, not by the Application; Cilium
  # identities only add noise to the tree.
  resourceExclusions: |
    - apiGroups:
      - internal.virtualization.deckhouse.io
      - cdi.internal.virtualization.deckhouse.io
      kinds:
      - "*"
      clusters:
      - "*"
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      clusters:
      - "*"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  dnsNames:
    - argo.pt.dvp.flant.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  secretName: argocd-ingress-tls
