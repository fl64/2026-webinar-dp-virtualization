        if phase == "Ready" then
          hs.status = "Healthy"
          hs.message = "VirtualMachineSnapshot ready"
        elseif phase == "Failed" then
          hs.status = "Degraded"
          hs.message = "VirtualMachineSnapshot failed: " .. (obj.status.message or "unknown error")
        elseif phase == "Pending" or phase == "InProgress" then
          hs.status = "Progressing"
          hs.message = "VirtualMachineSnapshot: " .. phase
        else
          hs.status = "Progressing"
          hs.message = "VirtualMachineSnapshot: " .. phase
        end
        return hs

    # VirtualMachineRestore
    - group: virtualization.deckhouse.io
      kind: VirtualMachineRestore
      check: |
        hs = {}
        if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
          hs.status = "Progressing"
          hs.message = "VirtualMachineRestore is terminating"
          return hs
        end
        if not obj.status or not obj.status.phase then
          hs.status = "Progressing"
          hs.message = "Waiting for VirtualMachineRestore status"
          return hs
        end
        local phase = obj.status.phase
        if phase == "Ready" then
          hs.status = "Healthy"
          hs.message = "VirtualMachineRestore ready"
        elseif phase == "Failed" then
          hs.status = "Degraded"
          hs.message = "VirtualMachineRestore failed: " .. (obj.status.message or "unknown error")
        elseif phase == "Pending" or phase == "InProgress" then
          hs.status = "Progressing"
          hs.message = "VirtualMachineRestore: " .. phase
        else
          hs.status = "Progressing"
          hs.message = "VirtualMachineRestore: " .. phase
        end
        return hs

    # VirtualDiskSnapshot
    - group: virtualization.deckhouse.io
      kind: VirtualDiskSnapshot
      check: |
        hs = {}
        if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
          hs.status = "Progressing"
          hs.message = "VirtualDiskSnapshot is terminating"
          return hs
        end
        if not obj.status or not obj.status.phase then
          hs.status = "Progressing"
          hs.message = "Waiting for VirtualDiskSnapshot status"
          return hs
        end
        local phase = obj.status.phase
        if phase == "Ready" then
          hs.status = "Healthy"
          hs.message = "VirtualDiskSnapshot ready"
        elseif phase == "Failed" then
          hs.status = "Degraded"
          hs.message = "VirtualDiskSnapshot failed: " .. (obj.status.message or "unknown error")
        elseif phase == "Pending" or phase == "InProgress" then
          hs.status = "Progressing"
          hs.message = "VirtualDiskSnapshot: " .. phase
        else
          hs.status = "Progressing"
          hs.message = "VirtualDiskSnapshot: " .. phase
        end
        return hs


    # VirtualMachineMACAddress
    - group: virtualization.deckhouse.io
      kind: VirtualMachineMACAddress
      check: |
        hs = {}
        if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
          hs.status = "Progressing"
          hs.message = "VirtualMachineMACAddress is terminating"
          return hs
        end
        if not obj.status or not obj.status.phase then
          hs.status = "Progressing"
          hs.message = "Waiting for VirtualMachineMACAddress status"
