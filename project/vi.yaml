# One cloud image for the whole project: the kubectl, kustomize, terraform and pool disks are all made from it.
apiVersion: virtualization.deckhouse.io/v1alpha2
kind: VirtualImage
metadata:
  name: demo-ubuntu
  namespace: demo-webinar
spec:
  storage: ContainerRegistry
  dataSource:
    type: HTTP
    http:
      url: https://mirror.yandex.ru/ubuntu-cloud-images/minimal/releases/resolute/release-20260723/ubuntu-26.04-minimal-cloudimg-amd64.img
