---
apiVersion: deckhouse.io/v1alpha3
kind: Project
metadata:
  name: demo-argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: VM deployed by Argo CD from git
  projectTemplateName: default
  # In v1alpha3 the administrators and the quota are fields of their own; the v1alpha2 form,
  # where both lived under parameters, the webhook now rejects against the template schema.
  administrators:
    - kind: Group
      name: demo-argocd
  quota:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "2"
    limits.memory: 4Gi
